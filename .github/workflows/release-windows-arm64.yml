# Build a Windows ARM64 NSIS installer and attach it to a GitHub Release.
# Trigger: push a version tag (v0.1.0) or run manually from the Actions tab.
#
# README download link stays valid forever via:
#   https://github.com/<owner>/<repo>/releases/latest/download/GenieX-Model-Manager-Setup-arm64.exe

name: Release Windows ARM64

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-11-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run package
        env:
          # Unsigned local/CI builds — skip code-sign discovery noise
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: geniex-model-manager-windows-arm64
          path: release/GenieX-Model-Manager-Setup-arm64.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/GenieX-Model-Manager-Setup-arm64.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
