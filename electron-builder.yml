appId: com.neuronvs.neuron
productName: Neuron
copyright: Copyright © 2026
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - catalog/**/*
  - media/**/*
win:
  icon: media/code.ico
  target:
    - target: nsis
      arch:
        - arm64
  # Stable name so README can always link:
  # …/releases/latest/download/Neuron-Setup-arm64.exe
  artifactName: Neuron-Setup-arm64.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Neuron
  installerLanguages:
    - en_US
  displayLanguageSelector: false
  deleteAppDataOnUninstall: false
